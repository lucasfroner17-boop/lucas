<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <h1>Tipo de dados</h1>
    <p   id="teste1">0 valor é (a):</p>
    <p   id="teste2">0 valor é (b):</p>
    <p   id="teste3">0 valor é (c):</p>
    <p   id="teste4">0 valor é (d):</p>
    <p   id="teste5">0 valor é (e):</p>
    <p   id="teste6">0 valor é (f):</p>
    <p   id="teste7">0 valor é (g):</p>
    <script type="text/javascript">
//criar variaveis
     var a; //texto + numero
     var b = 1; //inteiro
     var c = [55,21,34,49,50]; //vetor -- array - numeros
     var d = ['verde', 'amarelo', 'azul', 'branco']; //vetor -- array - texto
     var e = 'senac'; //texto pré definido
     var f = false; //logico - true e false
     var g = null //vazio sem valor
 
 
     document.getElementById('teste1').innerHTML += a;
     document.getElementById('teste2').innerHTML += b;
     document.getElementById('teste3').innerHTML += c[2];
     document.getElementById('teste4').innerHTML += d[2];
     document.getElementById('teste5').innerHTML += e;
     document.getElementById('teste6').innerHTML += f;
     document.getElementById('teste7').innerHTML += g;
    </script>
</body>
</html>
