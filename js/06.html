<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAVASCRIPT</title>
</head>
<body>
    <h1>Operadores lógicos</h1>
    <h3>Logico && (e) </h3>
 
    <script type="text/javascript">
var resposta = true && true;
document.write(resposta + '<br>');
 
var resposta = false && false;
document.write(resposta + '<br>');
 
var resposta = false && true;
document.write(resposta + '<br>');
 
var resposta = false && (3 == 4);
document.write(resposta + '<br>');
 
var resposta = 'Senac' && 'JavaScript';
document.write(resposta + '<br>');
 
resposta = false && '';
document.write(resposta + '<br>');
 
    </script>
 
<h3>logico || (ou) </h3>
<script type="text/javascript">
var resposta = true || true;
document.write(resposta + '<br>');
 
var resposta = false || true;
document.write(resposta + '<br>');
 
var resposta = false || (3 == 4);
document.write(resposta + '<br>');
 
var resposta = 'Senac' || "JavaScript";
document.write(resposta + '<br>');
 
 
 
 
 
</script>
</body>
</html>
