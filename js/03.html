<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Variavel do tipo objeto</h1>
    <p id="dados">Dados do Carro: </p>

<script type="text/Javascript">
var meuCarro = new Object();
meuCarro.fabrica = 'Volswagen';
meuCarro.modelo = 'jetta';
meuCarro.cor = 'Azul';
meuCarro.ano = 2024;

document.getElementById('dados'). innerHTML += meuCarro.fabrica +' - '
+ meuCarro.modelo + ' - ' + meuCarro.cor + ' - ' + meuCarro.ano;
    
</script>

</body>
